openapi: 3.0.3
info:
  title: Rent & Play API
  version: 0.5.0
  description: Local Lakewood delivery, scheduled rentals, verified payment records and physical return. ESP32 routes default to standby (ENABLE_ESP32=false).
paths:
  /api/auth/email-check:
    post:
      summary: Validate an email and a domain capable of receiving mail
      description: Public and rate limited. Lowercases emails, rejects whitespace, and accepts valid company or school domains. DNS failures ask the caller to retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountEmail'}
      responses:
        '200': {description: Email domain validated}
        '400': {description: Invalid syntax or INVALID_EMAIL_DOMAIN}
        '503': {description: Temporary DNS failure}
  /api/auth/password-reset:
    post:
      summary: Request a reset email for an explicitly entered recipient
      description: Public and rate limited. Checks email format without DNS/domain validation. Confirmation names the email without revealing whether the account exists. Real provider failures are reported.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountEmail'}
      responses:
        '200': {description: Recipient and generic reset instructions}
        '400': {description: Invalid email format}
        '429': {description: Too many requests}
        '503': {description: Reset provider temporarily unavailable}
  /api/auth/change-password:
    post:
      summary: Change the temporary password before entering the staff workspace
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
                newPassword: {$ref: '#/components/schemas/AccountPassword'}
                confirmPassword: {$ref: '#/components/schemas/AccountPassword'}
                remember: {type: boolean, default: false}
      responses:
        '200': {description: Password updated and temporary-password flag cleared; web session renewed or signInAgain true; mobile signs in again}
        '400': {description: Incorrect current password, weak new password, unchanged password, or confirmation mismatch}
        '401': {description: Authentication required}
        '403': {description: Only active staff accounts may change a staff password}
  /api/users:
    post:
      summary: Owner creates a separate Owner or Operator account
      description: Email format is checked without DNS/domain validation. Generated mode emails a cryptographically random temporary password. Email failure rolls back creation. Manual mode requires password and confirmation. Passwords never appear in the response or Firestore.
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, role, passwordMode]
              properties:
                fullName: {type: string, minLength: 2, maxLength: 150}
                email: {type: string, format: email, maxLength: 254}
                role: {type: string, enum: [OWNER, OPERATOR]}
                passwordMode: {type: string, enum: [generated, manual]}
                password: {$ref: '#/components/schemas/AccountPassword'}
                confirmPassword: {$ref: '#/components/schemas/AccountPassword'}
      responses:
        '201': {description: Created staff user with mustChangePassword and credentialsEmailSent; no password returned}
        '400': {description: Invalid account details or missing manual password confirmation}
        '403': {description: Owner access required or PASSWORD_CHANGE_REQUIRED}
        '409': {description: Email already in use}
        '503': {description: Generated credential email could not be delivered}
  /api/notifications:
    get:
      summary: Read the authenticated rental notification inbox
      description: Staff share an inbox with individual read status. Customers see only their own inbox. Pages contain up to 60 messages.
      security: [{adminSession: []}, {mobileAdminToken: []}, {customerFirebaseToken: []}]
      parameters:
        - {in: query, name: before, schema: {type: string, pattern: '^n_[a-f0-9]{40}$'}, description: Last message ID of the previous page}
        - {in: query, name: since, schema: {type: string}, description: Previous inbox revision; returns unchanged when no update exists}
      responses:
        '200': {description: Notifications with next_cursor and revision, or unchanged with revision}
        '401': {description: Authentication required}
        '403': {description: Inactive or missing account}
        '404': {description: Cursor does not belong to this inbox}
  /api/notifications/read:
    post:
      summary: Mark loaded inbox messages read for the authenticated account
      security: [{adminSession: []}, {mobileAdminToken: []}, {customerFirebaseToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, maxItems: 60, items: {type: string, pattern: '^n_[a-f0-9]{40}$'}}
      responses:
        '200': {description: Read markers persisted}
        '400': {description: Invalid notification IDs}
        '404': {description: A notification does not belong to this inbox}
  /api/notifications/device:
    post:
      summary: Register or transfer an Android push token to the authenticated account
      security: [{adminSession: []}, {mobileAdminToken: []}, {customerFirebaseToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationDevice'}
      responses:
        '200': {description: Android device registered}
        '400': {description: Invalid push token}
    delete:
      summary: Unregister an Android token only when the authenticated account owns it
      security: [{adminSession: []}, {mobileAdminToken: []}, {customerFirebaseToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationDevice'}
      responses:
        '200': {description: Owned registration removed}
  /api/workspace:
    get:
      summary: Full administration history including every verification attempt
      security: [{adminSession: []}, {mobileAdminToken: []}]
      responses:
        '200': {description: Workspace records with saved inspections and fees}
        '401': {description: Active administrator session required}
  /api/analytics:
    get:
      summary: Return cached aggregate rental and catalog metrics for the Android report
      security: [{adminSession: []}, {mobileAdminToken: []}]
      responses:
        '200': {description: Rental totals and catalog count without returning full records}
        '401': {description: Active administrator session required}
  /api/mobile/admin-workspace:
    get:
      summary: Load the Android staff workspace, dashboard, and inventory using shared cached reads
      description: An explicit Cache-Control no-cache request invalidates display snapshots before loading.
      security: [{adminSession: []}, {mobileAdminToken: []}]
      responses:
        '200': {description: Workspace records plus _dashboard and _inventory views}
        '401': {description: Active administrator session required}
  /api/customer-accounts:
    post:
      summary: Create optional app access or add it to an existing walk-in profile without changing its identity
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password, confirmPassword]
              properties:
                fullName: {type: string, minLength: 2, maxLength: 150}
                customerId: {type: string, description: Existing active profile without app access. Auth UID equals this ID so rental history stays linked}
                code: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{1,49}$'}
                email: {type: string, format: email, maxLength: 254}
                phone: {type: string, maxLength: 40}
                address: {type: string, maxLength: 500}
                password: {$ref: '#/components/schemas/AccountPassword'}
                confirmPassword: {$ref: '#/components/schemas/AccountPassword'}
      responses:
        '201': {description: Firebase CUSTOMER account and customer profile created with the same UID}
        '400': {description: Invalid name, customer code, contact details, or password}
        '401': {description: Administrator authentication required}
        '409': {description: Duplicate customer/email or profile already has app access}
  /api/customers:
    post:
      summary: Create a walk-in customer profile without an auth login
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone]
              properties:
                fullName: {type: string, minLength: 2, maxLength: 150}
                phone: {type: string, maxLength: 40, description: Valid Philippine mobile number}
                email: {type: string, maxLength: 254, description: Optional valid email}
                address: {type: string, maxLength: 500}
                requestKey: {$ref: '#/components/schemas/OperationKey'}
      responses:
        '201': {description: Profile created or matching retry returned; server assigns its CUST-code}
        '400': {description: Invalid customer details}
        '401': {description: Active staff authentication required}
        '409': {description: Name and normalized phone or email matches an existing profile; reuse or restore it}
  /api/rentals/{rentalId}/prepare-delivery:
    post:
      summary: Verify the exact reserved unit at the shop before either shop handover or resort delivery
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - {in: path, name: rentalId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryCode]
              properties:
                inventoryCode: {type: string, maxLength: 256}
                manualLookup: {type: boolean}
                manualReason: {type: string, maxLength: 1000}
      responses:
        '200': {description: Unit prepared with the rental timer stopped; repeated preparation is idempotent}
        '409': {description: Expired hold, wrong unit, or changed reservation}
  /api/rentals/{rentalId}/release-verification:
    post:
      summary: Read-only verification of a prepared rental using customer QR or an audited staff-assisted public reference
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - {in: path, name: rentalId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionCode]
              properties:
                transactionCode: {type: string, maxLength: 256}
                manualLookup: {type: boolean}
                manualReason: {type: string, maxLength: 1000}
      responses:
        '200': {description: Matching rental reference and prepared unit verified without starting the timer}
        '409': {description: Wrong reference, unprepared unit, expired hold, or changed assignment}
  /api/customers/{customerId}:
    delete:
      summary: Permanently delete an archived customer and linked mobile account
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: string, description: Current updated_at value, or created_at for legacy records}
      responses:
        '200': {description: Customer removed; completed rental history and audit logs remain}
        '400': {description: Missing or invalid customer version}
        '401': {description: Administrator authentication required}
        '404': {description: Customer not found}
        '409': {description: Customer is active, changed, or has an active or pending rental}
        '503': {description: Linked mobile account deletion is unavailable}
  /api/customers/{customerId}/password:
    patch:
      summary: Change the password for a linked customer mobile account
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword, confirmNewPassword]
              properties:
                newPassword: {$ref: '#/components/schemas/AccountPassword'}
                confirmNewPassword: {$ref: '#/components/schemas/AccountPassword'}
      responses:
        '200': {description: Linked Firebase password changed; the audit log records no password value}
        '400': {description: Password does not meet length requirements or confirmation differs}
        '401': {description: Administrator authentication required}
        '404': {description: Customer not found}
        '409': {description: No valid linked mobile account}
        '503': {description: Mobile account password changes are unavailable}
  /api/rental-bookings:
    post:
      summary: Reserve a counter booking as APPROVED without starting its timer
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CounterBooking'}
      responses:
        '201': {description: Approved booking held for pickup or existing identical retry}
        '409': {description: Unit unavailable or reused key has different details}
  /api/rentals/lookup:
    post:
      summary: Find a transaction or the unique active borrower of a physical unit
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, minLength: 1, maxLength: 256}
                kind: {type: string, enum: [BOOKING, INVENTORY], default: BOOKING}
      responses:
        '200': {description: Rental and assigned physical item}
        '404': {description: No unique booking or equipment matches}
        '409': {description: Inventory has no unique active rental}
  /api/rentals/{rentalId}/release:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Verify transaction and inventory QR and start the timer at physical release
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelease'}
      responses:
        '200': {description: ACTIVE rental and RENTED unit; identical retry is a duplicate}
        '400': {description: Missing payment, customer or inspection verification}
        '409': {description: Wrong QR, reused key, or unavailable state}
  /api/rentals/{rentalId}/receipt:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Record server physical receipt and stop overtime before inspection
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminReceipt'}
      responses:
        '200': {description: RETURN_PENDING_INSPECTION rental and UNDER_INSPECTION unit}
        '409': {description: Wrong inventory QR, reused key or inconsistent active rental}
  /api/rentals/{rentalId}/complete-return:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Inspect a received unit and finalize charges from original rates and receipt time
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCompleteReturn'}
      responses:
        '200': {description: COMPLETED rental; available unit or linked maintenance with separate money balances}
        '400': {description: Missing inspection, explicit penalty or positive penalty reason}
        '409': {description: Physical receipt missing, reused key or original pricing unknown}
  /api/rentals/{rentalId}/assignment:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Atomically move an approved hold to an available unit of the same product and price
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryCode, reason]
              properties:
                inventoryCode: {type: string}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: Assigned unit and both hold pointers updated with audit}
        '409': {description: Different pricing, unavailable unit or booking already released}
  /api/rentals/{rentalId}/settlement:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Record actual rental collection and refunds after rental completion or closure
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RentalSettlement'}
      responses:
        '200': {description: Audited money movement and recalculated balances, or identical duplicate}
        '400': {description: Amounts exceed balances or no positive amount supplied}
        '409': {description: Legacy receipts unknown or reused key changed}
  /api/rental-inspection-photos/{photoId}:
    parameters:
      - {name: photoId, in: path, required: true, schema: {type: string}}
    get:
      summary: Read an admin-only inspection JPEG separately from rental lists
      security: [{adminSession: []}, {mobileAdminToken: []}]
      responses:
        '200': {description: Photo with data URL and inspection metadata}
        '404': {description: Photo missing}
  /api/mobile/rentals/{rentalId}/ticket:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    get:
      summary: Read own transaction QR token and PNG image for pickup
      security: [{customerFirebaseToken: []}]
      responses:
        '200': {description: Ticket with value, image_data_url, booking ID/code, status and hold expiry}
        '403': {description: Another customer owns the ticket}
        '409': {description: Legacy booking has no transaction QR}
  /api/rentals:
    post:
      summary: Legacy terminal reservation; disabled while ESP32 is on standby
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RentalRequest'}
      responses:
        '201': {description: Saved rental and pending verification request}
        '400': {description: Invalid pricing or request details}
        '401': {description: Administrator authentication required}
        '409': {description: Equipment unavailable or terminal unconfigured}
  /api/mobile/catalog:
    get:
      summary: Actual active inventory IDs, public rates, availability, QR labels, and Firebase project ID
      security: []
      responses:
        '200': {description: Public catalog without customer or staff records}
  /api/mobile/catalog/resolve:
    post:
      summary: Resolve a unique actual equipment QR token, item code, or ID
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200': {description: Public equipment group with scanned_unit_id and scanned_unit_code for the exact physical label, plus Firebase project ID; group-only lookup leaves the scanned unit fields null}
        '404': {description: Unknown or ambiguous QR label}
  /api/mobile/profile:
    get:
      summary: Read own profile using verified Firebase identity
      security: [{customerFirebaseToken: []}]
      responses:
        '200': {description: Own profile and Firebase project ID}
        '403': {description: Account inactive}
    post:
      summary: Bootstrap a regular CUSTOMER profile from verified Firebase claims
      security: [{customerFirebaseToken: []}]
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileProfile'}
      responses:
        '200': {description: Existing or created regular user profile}
    patch:
      summary: Edit own contact details, profile photo, ID reference, and terms acceptance
      security: [{customerFirebaseToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileProfile'}
      responses:
        '200': {description: Updated own profile; payload cannot change role or token identity}
  /api/mobile/quote:
    post:
      summary: Quote an available actual inventory item using the shared saved rates
      security: [{customerFirebaseToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, durationMinutes]
              properties:
                itemId: {type: string}
                durationMinutes: {type: integer, minimum: 1, maximum: 10080}
      responses:
        '200': {description: Authoritative quote with package components, billed duration, rental fee, and total}
        '400': {description: Rental rate needs configuration}
        '409': {description: Equipment unavailable or reserved}
  /api/mobile/rentals:
    get:
      summary: Own rental records with canonical fields, UTC dates, actual QR labels, and saved charges
      security: [{customerFirebaseToken: []}]
      responses:
        '200': {description: Owned canonical and legacy records without duplicates}
    post:
      summary: Submit a customer rental request for web admin review without a terminal
      security: [{customerFirebaseToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileRentalRequest'}
      responses:
        '201': {description: Rental saved with PENDING_ADMIN_APPROVAL status}
        '400': {description: Invalid quote, payment method, or request details}
        '401': {description: Valid Firebase customer ID token required}
        '409': {description: Equipment unavailable or already reserved}
  /api/mobile/rentals/{rentalId}/review:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Approve or reject a mobile customer rental request from the admin workspace
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileRentalReview'}
      responses:
        '200': {description: APPROVED and awaiting pickup without a running timer, or rejected with hold released}
        '400': {description: Invalid review or payment confirmation}
        '401': {description: Active administrator session required}
        '409': {description: Request already reviewed or equipment unavailable}
  /api/mobile/rentals/{rentalId}:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    get:
      summary: Read an owned rental record
      security: [{customerFirebaseToken: []}]
      responses:
        '200': {description: Owned rental with canonical fields and UTC dates}
        '403': {description: Another customer owns the record}
        '404': {description: Record missing}
  /api/mobile/rentals/{rentalId}/return:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Request staff receipt of own active mobile rental; equipment stays rented
      security: [{customerFirebaseToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                condition: {type: string, enum: [GOOD, FAIR, DAMAGED, NEEDS_INSPECTION]}
                notes: {type: string, maxLength: 2000}
      responses:
        '200': {description: Pending return request or existing duplicate; rental remains ACTIVE}
        '403': {description: Another customer owns the rental}
        '409': {description: Rental not active or requires a counter return}
  /api/mobile/rentals/{rentalId}/return/review:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Complete inspection after physical receipt or reject the customer request
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileReturnReview'}
      responses:
        '200': {description: Completion and original-rate fees committed with inspection and availability or maintenance; rejection leaves rental active}
        '400': {description: Missing official inspection or explicit penalty amount}
        '409': {description: Inconsistent state or incomplete original fee snapshot}
  /api/mobile/rentals/{rentalId}/cancel:
    parameters:
      - {name: rentalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Cancel an owned pending or approved booking before physical release
      security: [{customerFirebaseToken: []}]
      responses:
        '200': {description: Rental request cancelled and equipment reservation released}
        '401': {description: Valid Firebase customer ID token required}
        '403': {description: Rental request belongs to another customer}
        '404': {description: Rental request not found}
        '409': {description: Booking is already released or closed}
  /api/returns:
    post:
      summary: Legacy terminal return; disabled while ESP32 is on standby
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReturnRequest'}
      responses:
        '201': {description: Pending return request and fee preview}
        '400': {description: Invalid inspection, penalty, or return time}
        '401': {description: Administrator authentication required}
        '409': {description: Rental inactive or another return pending}
  /api/verification-requests/{requestId}/inspection:
    parameters:
      - {name: requestId, in: path, required: true, schema: {type: string}}
    put:
      summary: Record the authenticated inspector without finalizing the handoff
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Inspection'}
                - type: object
                  required: [revision]
                  properties:
                    revision: {type: integer, minimum: 0}
                    penaltyAmount: {type: number, nullable: true, minimum: 0, multipleOf: 0.01}
                    penaltyReason: {type: string, maxLength: 1000}
      responses:
        '200': {description: Pending request with incremented inspection revision}
        '400': {description: Invalid inspection}
        '401': {description: Administrator authentication required}
        '409': {description: Closed request or stale inspection revision}
  /api/terminals/{terminalId}/pending:
    parameters:
      - {name: terminalId, in: path, required: true, schema: {type: string}}
    get:
      summary: Poll pending requests and record device heartbeat
      description: Future hardware integration only. ENABLE_ESP32=false returns 409 before device polling. Current rentals use the staff desk.
      security: [{terminalDeviceKey: []}]
      responses:
        '200': {description: Requests with saved fees, inspection revisions, and deadlines}
        '401': {description: Invalid or inactive device credential}
        '409': {description: ESP32 is on standby}
  /api/terminals/{terminalId}/confirm:
    parameters:
      - {name: terminalId, in: path, required: true, schema: {type: string}}
    post:
      summary: Atomically confirm or reject an assigned handoff from the terminal
      description: Future hardware integration only. ENABLE_ESP32=false returns 409 without modifying a handoff.
      security: [{terminalDeviceKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, verificationCode]
              properties:
                requestId: {type: string}
                verificationCode: {type: string, pattern: '^[0-9]{6}$'}
                action: {type: string, enum: [CONFIRM, REJECT], default: CONFIRM}
                button: {type: string, enum: [OK], description: Required when confirming}
                inspectionRevision: {type: integer, minimum: 1, description: Displayed revision required when confirming}
                reason: {type: string, maxLength: 1000, description: Required when rejecting}
      responses:
        '200': {description: Final request status; duplicate retransmissions have duplicate true}
        '400': {description: Invalid button action or missing rejection reason}
        '401': {description: Device authentication required; web cookies never substitute}
        '409': {description: ESP32 standby or incorrect terminal/code/revision or inconsistent lifecycle}
        '410': {description: Deadline elapsed; expiry has been persisted}
  /api/maintenance:
    post:
      summary: Report an issue for one physical equipment unit
      description: Staff only. Blocks only this unit from rental, rejects duplicate open tickets and rented or reserved units, and preserves its equipment QR and grouped stock.
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceReport'}
      responses:
        '201':
          description: Saved ticket and unavailable physical unit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceMutation'}
        '400': {description: Invalid issue, assignment, target date or photo}
        '401': {description: Staff authentication required}
        '403': {description: Active staff account with completed password change required}
        '409': {description: Stale unit version, duplicate open ticket, or unit with an unresolved rental}
  /api/maintenance-staff:
    get:
      summary: List active operators and owners eligible for a repair assignment
      security: [{adminSession: []}, {mobileAdminToken: []}]
      responses:
        '200':
          description: Minimal staff identities with saved public account references
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, description: Internal account identifier used for assignedTo}
                        account_code: {type: string, example: USER-0001}
                        full_name: {type: string}
                        role: {type: string}
        '401': {description: Staff authentication required}
        '403': {description: Active staff account required}
  /api/maintenance/{maintenanceId}:
    parameters:
      - {in: path, name: maintenanceId, required: true, schema: {type: string}, description: Internal ticket ID; display maintenance_code to users}
    get:
      summary: Read a current maintenance ticket and its physical unit
      security: [{adminSession: []}, {mobileAdminToken: []}]
      responses:
        '200':
          description: Current ticket, saved references and unit; item may be null for preserved historical tickets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceDetail'}
        '401': {description: Staff authentication required}
        '404': {description: Ticket not found}
    patch:
      summary: Update repair details or advance the maintenance workflow
      description: Reported to In repair to For inspection to Completed. Failed inspection returns to In repair. Completion requires all three checks and Good or Fair condition. Retirement closes the unit's open tickets and preserves its history. Closed tickets permit only cost corrections, notes and photos. Every mutation checks the saved revision.
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceUpdate'}
      responses:
        '200':
          description: Saved ticket, current unit and remaining open issue count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceMutation'}
        '400': {description: Invalid action, amount, assignment, notes, condition or inspection checks}
        '401': {description: Staff authentication required}
        '404': {description: Ticket not found}
        '409': {description: Stale revision or disallowed stage transition; refresh before retrying}
  /api/maintenance/{maintenanceId}/photos/{photoId}:
    get:
      summary: Read one authenticated maintenance photo
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - {in: path, name: maintenanceId, required: true, schema: {type: string}}
        - {in: path, name: photoId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Photo belonging to this exact ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_data: {type: string, description: Resized JPEG, PNG or WebP data URL}
                  caption: {type: string}
        '401': {description: Staff authentication required}
        '404': {description: Ticket or photo missing, or photo does not belong to the ticket}
  /api/records/{kind}:
    get:
      summary: Read a bounded rental/customer/maintenance page
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [rentals, customers, maintenance]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: search, in: query, schema: {type: string}}
        - {name: customerId, in: query, schema: {type: string}}
        - {name: itemId, in: query, schema: {type: string}}
        - {name: scheduledDay, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: Successful authenticated operation}
        '400': {description: Invalid fields}
        '401': {description: Active staff authentication required}
        '409': {description: Changed state or conflicting reservation}
  /api/finance/summary:
    get:
      summary: Precomputed cash/QR collections, refunds, expenses and net recorded cash
      security: [{adminSession: []}, {mobileAdminToken: []}]
      description: Selected from/to Philippine business days; up to 366 days. Ledger entries only, without guessed historical receipts.
      responses:
        '200': {description: Successful authenticated operation}
        '400': {description: Invalid fields}
        '401': {description: Active staff authentication required}
        '409': {description: Changed state or conflicting reservation}
  /api/finance/ledger:
    get:
      summary: Bounded immutable payment ledger entries
      security: [{adminSession: []}, {mobileAdminToken: []}]
      description: limit 1-100; cursor, from/to, day, type, method and rentalId filters. Public references use PAY-00001; fingerprints are private.
      responses:
        '200': {description: Successful authenticated operation}
        '400': {description: Invalid fields}
        '401': {description: Active staff authentication required}
        '409': {description: Changed state or conflicting reservation}
  /api/finance/expenses:
    post:
      summary: Record an actual cash/QR expense
      security: [{adminSession: []}, {mobileAdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpensePaid'}
      responses:
        '200': {description: Successful authenticated operation}
        '201': {description: Expense recorded}
        '400': {description: Invalid fields}
        '401': {description: Active staff authentication required}
        '409': {description: Changed state or conflicting reservation}
  /api/reports/daily:
    get:
      summary: Precomputed assessed rental charges by handoff day
      security: [{adminSession: []}, {mobileAdminToken: []}]
      description: from/to Philippine business days. Unknown charges are counted separately and do not invent amounts.
      responses:
        '200': {description: Successful authenticated operation}
        '400': {description: Invalid fields}
        '401': {description: Active staff authentication required}
        '409': {description: Changed state or conflicting reservation}
  /api/rentals/{rentalId}/delivery:
    post:
      summary: Advance a short local delivery or physically receive an unsuccessful delivery
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - {name: rentalId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocalDeliveryAction'}
      responses:
        '200': {description: Successful authenticated operation}
        '400': {description: Invalid fields}
        '401': {description: Active staff authentication required}
        '409': {description: Changed state or conflicting reservation}
  /api/rentals/{rentalId}/extension-review:
    post:
      summary: Approve or reject the current extension after rechecking the next reservation
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - {name: rentalId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [action, requestKey], properties: {action: {type: string, enum: [APPROVE, REJECT]}, requestKey: {$ref: '#/components/schemas/OperationKey'}, reason: {type: string, maxLength: 1000, description: Required for rejection}}}
      responses:
        '200': {description: Successful authenticated operation}
        '400': {description: Invalid fields}
        '401': {description: Active staff authentication required}
        '409': {description: Changed state or conflicting reservation}
  /api/mobile/rentals/{rentalId}/extension-quote:
    post:
      summary: Quote additional rental time without changing the rental
      security: [{customerFirebaseToken: []}]
      parameters:
        - {name: rentalId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RentalExtensionRequest'}
      responses:
        '200': {description: Quote or pending request; current due time applies until approval}
        '400': {description: Invalid duration, price or missing staff-witnessed customer agreement}
        '403': {description: Another customer's rental}
        '409': {description: Due time, return, pending request or next reservation prevents extension}
  /api/mobile/rentals/{rentalId}/extension:
    post:
      summary: Request additional rental time with the exact agreed price
      security: [{customerFirebaseToken: []}]
      parameters:
        - {name: rentalId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RentalExtensionRequest'}
      responses:
        '200': {description: Quote or pending request; current due time applies until approval}
        '400': {description: Invalid duration, price or missing staff-witnessed customer agreement}
        '403': {description: Another customer's rental}
        '409': {description: Due time, return, pending request or next reservation prevents extension}
  /api/rentals/{rentalId}/extension-quote:
    post:
      summary: Quote additional rental time without changing the rental
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - {name: rentalId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RentalExtensionRequest'}
      responses:
        '200': {description: Quote or pending request; current due time applies until approval}
        '400': {description: Invalid duration, price or missing staff-witnessed customer agreement}
        '403': {description: Another customer's rental}
        '409': {description: Due time, return, pending request or next reservation prevents extension}
  /api/rentals/{rentalId}/extension:
    post:
      summary: Request additional rental time with the exact agreed price
      security: [{adminSession: []}, {mobileAdminToken: []}]
      parameters:
        - {name: rentalId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RentalExtensionRequest'}
      responses:
        '200': {description: Quote or pending request; current due time applies until approval}
        '400': {description: Invalid duration, price or missing staff-witnessed customer agreement}
        '403': {description: Another customer's rental}
        '409': {description: Due time, return, pending request or next reservation prevents extension}
components:
  securitySchemes:
    adminSession: {type: apiKey, in: cookie, name: rent_play_session}
    mobileAdminToken: {type: http, scheme: bearer, bearerFormat: Firebase ID token, description: Must map to an active OPERATOR or OWNER profile; workspace access requires completion of temporary-password change}
    customerFirebaseToken: {type: http, scheme: bearer, bearerFormat: Firebase ID token, description: Must map to an active CUSTOMER profile in the same Firebase project}
    terminalDeviceKey: {type: http, scheme: bearer, description: Separately provisioned terminal key; never a Firebase token or web cookie}
  schemas:
    MaintenancePhotoInput:
      type: object
      required: [imageData]
      properties:
        imageData: {type: string, maxLength: 200000, description: Valid resized JPEG, PNG or WebP base64 data URL; decoded image under 150 KB}
        caption: {type: string, maxLength: 120}
    MaintenanceReport:
      type: object
      required: [itemId, reason, version]
      properties:
        itemId: {type: string, description: Exact physical unit ID from inventory}
        version: {type: string, nullable: true, description: Exact saved item.updated_at; null is supported only for older units without a timestamp}
        reason: {type: string, minLength: 1, maxLength: 255}
        notes: {type: string, maxLength: 2000}
        condition: {type: string, enum: [GOOD, FAIR, DAMAGED, NEEDS_INSPECTION], default: NEEDS_INSPECTION}
        priority: {type: string, enum: [LOW, NORMAL, HIGH, URGENT], default: NORMAL}
        assignedTo: {type: string, nullable: true}
        targetDate: {type: string, nullable: true, format: date}
        photos: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/MaintenancePhotoInput'}}
    MaintenanceUpdate:
      type: object
      required: [action, revision]
      properties:
        action: {type: string, enum: [update, start-repair, send-inspection, inspection-failed, complete, retire]}
        revision: {type: integer, minimum: 0, description: Exact current ticket revision; legacy tickets may start at zero}
        note: {type: string, maxLength: 2000, description: Required for send-inspection, inspection-failed, complete and retire}
        repairCost: {type: number, nullable: true, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01, description: Full actual ticket total; null is unknown and zero explicitly means no cost}
        priority: {type: string, enum: [LOW, NORMAL, HIGH, URGENT]}
        assignedTo: {type: string, nullable: true}
        targetDate: {type: string, nullable: true, format: date}
        condition: {type: string, enum: [GOOD, FAIR], description: Required for completion}
        checks:
          type: object
          required: [functional, safe, complete]
          description: All checks must be true before the unit returns to rental
          properties:
            functional: {type: boolean}
            safe: {type: boolean}
            complete: {type: boolean}
        photos: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/MaintenancePhotoInput'}}
    MaintenanceRecord:
      type: object
      properties:
        id: {type: string, description: Internal API identifier; never display as the ticket reference}
        maintenance_code: {type: string, pattern: '^M-[0-9]{4,}$', example: M-0001, description: Persisted public reference shared by web and mobile}
        item_id: {type: string}
        item_code: {type: string, example: EQUIP-001, description: Existing physical unit code and QR label are preserved}
        item_name: {type: string}
        rental_id: {type: string, nullable: true}
        status: {type: string, enum: [OPEN, IN_PROGRESS, COMPLETED, RETIRED]}
        workflow_stage: {type: string, enum: [REPORTED, IN_REPAIR, AWAITING_INSPECTION, COMPLETED, RETIRED]}
        revision: {type: integer, minimum: 0}
        reason: {type: string}
        priority: {type: string, enum: [LOW, NORMAL, HIGH, URGENT]}
        assigned_to: {type: string, nullable: true}
        assigned_name: {type: string, nullable: true}
        target_date: {type: string, nullable: true, format: date}
        repair_cost: {type: number, nullable: true}
        photos: {type: array, maxItems: 6, items: {type: object, properties: {id: {type: string}, caption: {type: string}, added_at: {type: string, format: date-time}}}}
        activity: {type: array, items: {type: object}}
    MaintenanceDetail:
      type: object
      required: [maintenance, item]
      properties:
        maintenance: {$ref: '#/components/schemas/MaintenanceRecord'}
        item: {type: object, nullable: true}
    MaintenanceMutation:
      allOf:
        - {$ref: '#/components/schemas/MaintenanceDetail'}
        - type: object
          properties:
            remaining_open_tickets: {type: integer, minimum: 0}
    AccountEmail:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254, description: No whitespace; normalized to lowercase. DNS is checked only by the mobile email-check and registration endpoints}
    AccountPassword:
      type: string
      minLength: 8
      maxLength: 128
      writeOnly: true
      pattern: '^(?=[\s\S]*[A-Z])(?=[\s\S]*[0-9])[\s\S]+$'
      description: At least eight characters, a capital letter, and a number; confirmation must match
    NotificationDevice:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 20, maxLength: 4096, writeOnly: true}
    OperationKey:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: Preserve this key when retrying the same operation; changed details are rejected
    CounterBooking:
      type: object
      required: [itemId, customerId, requestKey]
      properties:
        scheduledStartAt: {type: string, format: date-time, description: Optional; timezone required; at least 5 minutes ahead and within 180 days}
        deliveryArea: {type: string, enum: ["Lakewood Subdivision, Los Baños, Laguna"]}
        itemId: {type: string}
        customerId: {type: string}
        rentalChannel: {type: string, enum: [WALK_IN], description: Staff-assisted rental; omitted for legacy counter clients}
        fulfillmentMode: {type: string, enum: [SHOP_HANDOVER, DELIVERY], default: SHOP_HANDOVER, description: Used for WALK_IN; resort delivery requires deliveryLocation}
        requestKey: {$ref: '#/components/schemas/OperationKey'}
        mode: {type: string, enum: [TIMED, WHOLE_STAY], default: TIMED}
        durationMinutes: {type: integer, minimum: 1, maximum: 10080, description: Required for TIMED}
        resortCheckoutAt: {type: string, format: date-time, description: Required for WHOLE_STAY}
        deliveryLocation: {type: string, maxLength: 255, default: Shop pickup}
        paymentMethod: {type: string, enum: [CASH, QR], default: CASH}
    AdminInspection:
      allOf:
        - {$ref: '#/components/schemas/Inspection'}
        - type: object
          required: [accessoriesChecked]
          properties:
            accessoriesChecked: {type: boolean, enum: [true]}
            photos:
              type: array
              maxItems: 2
              items: {type: string, maxLength: 150000, description: Valid JPEG base64 data URL}
    AdminRelease:
      type: object
      required: [requestKey, transactionCode, customerVerified, inspection]
      properties:
        requestKey: {$ref: '#/components/schemas/OperationKey'}
        transactionCode: {type: string, maxLength: 256}
        inventoryCode: {type: string, maxLength: 256}
        customerVerified: {type: boolean, enum: [true]}
        customerTermsAcknowledged: {type: boolean, enum: [true], description: Required for WALK_IN; staff witnessed customer agreement to total, duration, late fees, grace and return terms}
        paymentVerified: {type: boolean, description: Required true unless saved full payment was already received}
        manualLookup: {type: boolean, description: Allows the saved public rental reference instead of its secret QR token}
        manualReason: {type: string, minLength: 1, maxLength: 1000}
        inspection: {$ref: '#/components/schemas/AdminInspection'}
    AdminReceipt:
      type: object
      required: [requestKey, inventoryCode, physicalReceiptConfirmed]
      properties:
        requestKey: {$ref: '#/components/schemas/OperationKey'}
        inventoryCode: {type: string, maxLength: 256}
        physicalReceiptConfirmed: {type: boolean, enum: [true]}
        manualReason: {type: string, minLength: 1, maxLength: 1000}
    AdminCompleteReturn:
      type: object
      required: [requestKey, inspection, penaltyAmount]
      properties:
        requestKey: {$ref: '#/components/schemas/OperationKey'}
        inspection: {$ref: '#/components/schemas/AdminInspection'}
        penaltyAmount: {type: number, minimum: 0, multipleOf: 0.01, description: Explicit zero when none applies}
        penaltyReason: {type: string, maxLength: 1000, description: Required for positive penalty}
    RentalSettlement:
      type: object
      required: [requestKey, notes]
      properties:
        requestKey: {$ref: '#/components/schemas/OperationKey'}
        paymentAmount: {type: number, minimum: 0, multipleOf: 0.01, default: 0}
        rentalRefundAmount: {type: number, minimum: 0, multipleOf: 0.01, default: 0, description: Only for cancelled/rejected/expired rentals}
        paymentMethod: {type: string, enum: [CASH, QR], default: CASH}
        reference: {type: string, maxLength: 150, description: Required for manually recorded QR receipts/refunds}
        notes: {type: string, minLength: 1, maxLength: 1000}
    Inspection:
      type: object
      required: [condition, notes]
      properties:
        condition: {type: string, enum: [GOOD, FAIR, DAMAGED, NEEDS_INSPECTION]}
        notes: {type: string, minLength: 1, maxLength: 2000}
        result: {type: string, enum: [AVAILABLE, UNDER_MAINTENANCE], description: Damaged returns require maintenance; release must be available}
    RentalRequest:
      type: object
      required: [itemId, customerId, terminalId]
      properties:
        itemId: {type: string}
        customerId: {type: string}
        terminalId: {type: string}
        mode: {type: string, enum: [TIMED, WHOLE_STAY], default: TIMED}
        durationMinutes: {type: integer, minimum: 1, maximum: 10080, description: Required for timed rentals}
        resortCheckoutAt: {type: string, format: date-time, description: Required for whole-stay rentals}
        startAt: {type: string, format: date-time, description: Defaults to server time; must be within five minutes of now}
        inspection: {$ref: '#/components/schemas/Inspection'}
    MobileRentalRequest:
      type: object
      required: [itemId, durationMinutes, deliveryLocation, requestKey]
      properties:
        scheduledStartAt: {type: string, format: date-time, description: Optional; timezone required; at least 5 minutes ahead and within 180 days}
        deliveryArea: {type: string, enum: ["Lakewood Subdivision, Los Baños, Laguna"]}
        itemId: {type: string}
        stockGroupId: {type: string, description: Group identifier; backend selects one healthy available physical unit from this group}
        acceptedRentalTerms: {type: boolean, description: Current Android checkout includes true after the customer accepts this specific rental's terms}
        rentalTermsVersion: {type: string, maxLength: 80, example: 2026-10-13-rental-v1}
        durationMinutes: {type: integer, minimum: 1, maximum: 10080}
        startAt: {type: string, format: date-time, description: Defaults to server time; must be within five minutes of now}
        deliveryLocation: {type: string, minLength: 1, maxLength: 255}
        paymentMethod: {type: string, enum: [QR, CASH], default: CASH}
        requestKey: {type: string, pattern: '^[a-f0-9]{32}$', description: Same key and details return the existing owned request without a second reservation}
        expectedQuote:
          type: object
          required: [rentalFee, billedMinutes]
          properties:
            rentalFee: {type: number, minimum: 0}
            billedMinutes: {type: integer, minimum: 1}
    MobileRentalReview:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [APPROVE, REJECT]}
        paymentVerified: {type: boolean, description: Optional actual rental payment already received; timer stays stopped}
        notes: {type: string, maxLength: 1000}
        reason: {type: string, maxLength: 1000, description: Optional when rejecting; omitted or blank values record no reason}
    MobileProfile:
      type: object
      properties:
        name: {type: string, maxLength: 150}
        phone: {type: string, maxLength: 40}
        profileImageUrl: {type: string, maxLength: 2048}
        hasAcknowledgedIdRequirement: {type: boolean, description: Acknowledges the requirement to show physical ID at handoff; not identity verification}
        validIdUrl: {type: string, deprecated: true, enum: [physical_id_presented], description: Compatibility acknowledgement for older Android clients}
        hasAcceptedTerms: {type: boolean}
    MobileReturnReview:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [APPROVE, REJECT]}
        requestKey: {$ref: '#/components/schemas/OperationKey'}
        inspection: {$ref: '#/components/schemas/AdminInspection'}
        penaltyAmount: {type: number, minimum: 0, multipleOf: 0.01, description: Required explicitly when approving, including zero}
        penaltyReason: {type: string, maxLength: 1000, description: Required for a positive penalty}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Required when rejecting}
    ReturnRequest:
      type: object
      required: [rentalId, terminalId]
      properties:
        rentalId: {type: string}
        terminalId: {type: string}
        returnedAt: {type: string, format: date-time, description: Defaults to server receipt time; cannot precede release or be in the future}
        inspection: {$ref: '#/components/schemas/Inspection'}
        penaltyAmount: {type: number, nullable: true, minimum: 0, multipleOf: 0.01, description: Missing is unknown; explicit amount including zero required before confirmation}
        penaltyReason: {type: string, maxLength: 1000, description: Required for a positive penalty}

    ExpensePaid:
      type: object
      required: [requestKey, amount, notes, paymentMethod]
      properties:
        requestKey: {$ref: '#/components/schemas/OperationKey'}
        amount: {type: number, minimum: 0.01, maximum: 9999999999.99, multipleOf: 0.01}
        paymentMethod: {type: string, enum: [CASH, QR]}
        category: {type: string, enum: [DELIVERY, MAINTENANCE, SUPPLIES, UTILITIES, OTHER]}
        reference: {type: string, maxLength: 150, description: Required for QR}
        notes: {type: string, minLength: 1, maxLength: 500}
    RentalExtensionRequest:
      type: object
      required: [requestKey, additionalMinutes]
      properties:
        requestKey: {$ref: '#/components/schemas/OperationKey'}
        additionalMinutes: {type: integer, minimum: 15, maximum: 10080}
        expectedAdditionalFee: {type: number, minimum: 0, multipleOf: 0.01, description: Required when requesting; must equal the current quote}
        customerRequestedExtension: {type: boolean, description: Required true for a staff-assisted request}
    LocalDeliveryAction:
      type: object
      required: [requestKey, action]
      properties:
        requestKey: {$ref: '#/components/schemas/OperationKey'}
        action: {type: string, enum: [DEPART, FAIL, RETURN_TO_SHOP]}
        reason: {type: string, maxLength: 1000, description: Required for unsuccessful delivery}
        inventoryCode: {type: string, description: Exact returning unit QR/token or public equipment code}
        manualReason: {type: string, maxLength: 1000, description: Required for equipment-code lookup}
        condition: {type: string, enum: [GOOD, FAIR, DAMAGED, NEEDS_INSPECTION]}
        notes: {type: string, maxLength: 2000, description: Required for damage or inspection}
        physicalReceiptConfirmed: {type: boolean, description: Required true before freeing or maintaining the returned unit}
