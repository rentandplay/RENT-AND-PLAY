services:
  - type: web
    name: rent-and-play
    runtime: node
    plan: free
    buildCommand: npm --prefix apps/backend ci --omit=dev && npm --prefix apps/web run build
    startCommand: npm --prefix apps/backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        value: https://rent-and-play.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false