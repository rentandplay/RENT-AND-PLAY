name: Rent & Play CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install backend dependencies
      run: npm --prefix apps/backend ci
    - name: Test backend integration
      run: npm --prefix apps/backend test
    - name: Check web source
      run: npm --prefix apps/web run check
    - name: Test web workflows
      run: npm --prefix apps/web test
    - name: Build admin web
      run: npm --prefix apps/web run build
